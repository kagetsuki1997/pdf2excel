name: Build Windows exe

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:       # manual run: builds and uploads an artifact only (no release)

permissions:
  contents: write          # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pdfplumber xlsxwriter pymupdf fonttools pyinstaller

      - name: Build GUI exe
        run: >
          pyinstaller --onefile --windowed --name pdf2excel-gui
          --collect-data pdfminer --collect-all pypdfium2 --collect-all pymupdf
          pdf2excel_gui.py

      - name: Build command-line exe
        run: >
          pyinstaller --onefile --name pdf2excel
          --collect-data pdfminer --collect-all pypdfium2 --collect-all pymupdf
          pdf_tables_to_excel.py

      - name: Smoke test CLI exe (prints usage and exits)
        shell: bash
        run: |
          out="$(./dist/pdf2excel.exe 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "usage:"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
